<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sobre mim | César Gabriel</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .subtitulo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #334155;
      margin-top: 24px;
      margin-bottom: 12px;
      text-align: center;
    }
  </style>
</head>

<body class="bg-gray-100 font-sans min-h-screen flex items-center justify-center p-6">

  <div class="bg-white p-8 rounded-xl shadow-md max-w-md w-full">

    <h1 class="text-3xl text-center font-bold text-slate-700 mb-6">
      Sobre mim
    </h1>

    <img 
      class="w-48 h-48 object-cover rounded-full border-4 border-slate-700 p-1 mx-auto mb-4" 
      src="https://github.com/Ces4rGabriel.png" 
      alt="Foto de perfil de César Gabriel no GitHub"
    >

    <p class="text-center font-bold text-slate-800 text-lg">
      Meu nome é César Gabriel
    </p>

    <p class="text-center text-gray-600 mt-2">
      Gosto de empreender, criar projetos e explorar ideias que conectam tecnologia, imagem e natureza.
    </p>

    <h2 class="subtitulo">Meus interesses</h2>

    <ul class="bg-gray-200 p-4 rounded-lg text-slate-700">
      <li class="mb-2 hover:text-slate-900 transition">
        Empreender
      </li>
      <li class="mb-2 hover:text-slate-900 transition">
        Fotografias
      </li>
      <li class="mb-2 hover:text-slate-900 transition">
        Natureza
      </li>
    </ul>

    <div class="mt-6 text-center">
      <a 
        href="https://github.com/Ces4rGabriel" 
        target="_blank"
        class="inline-block bg-slate-700 text-white px-5 py-2 rounded-lg font-bold hover:bg-slate-900 transition"
      >
        Ver meu GitHub
      </a>
    </div>

  </div>

</body>
</html>
